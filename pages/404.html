<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · CII documentation</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="__PAGES_BASE__/design-system/logo.svg"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f7fb;
        --card: #ffffff;
        --text: #122b4d;
        --muted: #4a5b73;
        --border: #d8deea;
        --primary: #7955bd;
        --primary-hover: #6a46ac;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a121c;
          --card: #101b2a;
          --text: #eef2f8;
          --muted: #a9b6c8;
          --border: #24344a;
          --primary: #a98be0;
          --primary-hover: #bfa6ea;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 480px;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
      }
      .code {
        margin: 0;
        color: var(--primary);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 {
        margin: 8px 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--primary);
        font-weight: 600;
      }
      a:hover {
        color: var(--primary-hover);
      }
      a:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>
        This page doesn’t exist or has moved. Check the address, or continue to
        the documentation.
      </p>
      <ul>
        <li>
          <a href="__PAGES_BASE__/design-system/">CII Design System</a>
        </li>
      </ul>
    </main>
  </body>
</html>
