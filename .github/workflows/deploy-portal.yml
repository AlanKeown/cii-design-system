name: Deploy community portal
on:
  # Deploy only after the Verify workflow passes for a push to main.
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: cloudflare-portal
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require successful verification of the deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          verified=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$DEPLOY_SHA" -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last |
              .status == "completed" and .conclusion == "success" and
              .head_sha == env.DEPLOY_SHA and .head_branch == "main" and .event == "push"')
          if [ "$verified" != "true" ]; then
            echo "::error::Commit $DEPLOY_SHA must pass its latest push-triggered Verify run on main before deployment."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          # Deploy the exact commit that passed verification.
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run build --workspace @cii/community-portal
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          workingDirectory: apps/community-portal
          wranglerVersion: 4.156.0
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy .svelte-kit/cloudflare --project-name=cii-community-portal --branch=main
