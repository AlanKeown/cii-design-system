name: Deploy community portal
on:
  # Deploy only after the Verify workflow passes for a push to main.
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  deployments: write
concurrency:
  group: cloudflare-portal
  cancel-in-progress: false
jobs:
  deploy:
    environment: production
    timeout-minutes: 20
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require successful verification of the deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          verified=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$DEPLOY_SHA" -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last |
              .status == "completed" and .conclusion == "success" and
              .head_sha == env.DEPLOY_SHA and .head_branch == "main" and .event == "push"')
          if [ "$verified" != "true" ]; then
            echo "::error::Commit $DEPLOY_SHA must pass its latest push-triggered Verify run on main before deployment."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          # Deploy the exact commit that passed verification.
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check release mode
        env:
          PORTAL_AUTH_ENABLED: ${{ vars.PORTAL_AUTH_ENABLED || 'false' }}
        run: |
          case "$PORTAL_AUTH_ENABLED" in
            true|false) ;;
            *) echo "::error::PORTAL_AUTH_ENABLED must be true or false."; exit 1 ;;
          esac
      - name: Validate production Auth and prepare public runtime bindings
        if: vars.PORTAL_AUTH_ENABLED == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_AUTH_GITHUB_ENABLED: ${{ vars.PUBLIC_AUTH_GITHUB_ENABLED || 'false' }}
        run: node --experimental-strip-types scripts/prepare-portal-production.ts
      - name: Apply production database migrations before deploying the portal
        if: vars.PORTAL_AUTH_ENABLED == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase db push --dry-run
          npx supabase db push --yes
      - run: npm run build:packages
      - run: npm run build --workspace @cii/community-portal
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          workingDirectory: apps/community-portal
          wranglerVersion: 4.156.0
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy
            ${{ vars.PORTAL_AUTH_ENABLED == 'true' && '--cwd .wrangler/production' || '.svelte-kit/cloudflare' }}
            --project-name=cii-community-portal --branch=main
      - name: Check the production signed-out routes
        if: vars.PORTAL_AUTH_ENABLED == 'true'
        run: node --experimental-strip-types scripts/smoke-portal-production.ts
