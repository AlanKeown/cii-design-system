name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
  # Runs the Supabase migrations on a fresh local database, then the pgTAP permission suite.
  # Part of the Verify workflow, so portal deployments are gated on it too.
  database:
    runs-on: ubuntu-latest
    steps:
      # These service ports overlap Linux's ephemeral range. Reserve them before
      # checkout, npm and Docker downloads can claim one for an outbound connection.
      - name: Reserve local Supabase ports
        run: |
          supabase_reserved_ports="$(sysctl -n net.ipv4.ip_local_reserved_ports)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${supabase_reserved_ports:+${supabase_reserved_ports},}54320-54329"
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:lint
      - name: Generated database types are current
        run: |
          npm run db:types
          git diff --exit-code -- apps/community-portal/src/lib/backend/database.types.ts
      - run: npm run build:packages && npm run build -w @cii/community-portal
      - run: npx playwright install --with-deps chromium
      - run: npm run test:portal-live
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: live-auth-test-results
          path: test-results/
      - if: always()
        run: npm run db:stop
