name: Deploy docs
on:
  # Deploy only after the Verify workflow passes for a push to main.
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Each docs site is published at /<repo>/<site>/ on GitHub Pages.
      PAGES_BASE: /${{ github.event.repository.name }}
      BASE_PATH: /${{ github.event.repository.name }}/design-system
    steps:
      - name: Require successful verification of the deployment commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          verified=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$DEPLOY_SHA" -f per_page=100 \
            --jq '.workflow_runs | sort_by(.run_number) | last |
              .status == "completed" and .conclusion == "success" and
              .head_sha == env.DEPLOY_SHA and .head_branch == "main" and .event == "push"')
          if [ "$verified" != "true" ]; then
            echo "::error::Commit $DEPLOY_SHA must pass its latest push-triggered Verify run on main before deployment."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          # Deploy the exact commit that passed verification.
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run build --workspace @cii/docs
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp -r apps/docs/build _site/design-system
          cp pages/*.html _site/
          sed -i "s#__PAGES_BASE__#$PAGES_BASE#g" _site/*.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}design-system/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
